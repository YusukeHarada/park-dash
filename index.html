<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Animal Escape!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1a3a18;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
    }
    #error-msg {
      display: none;
      color: #fff;
      background: #c0392b;
      padding: 16px;
      margin: 20px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="error-msg"></div>

  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('error-msg');
      el.style.display = 'block';
      el.textContent = 'エラー: ' + msg + '\n' + src + ':' + line;
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"
    onerror="document.getElementById('error-msg').style.display='block';document.getElementById('error-msg').textContent='Phaserの読み込みに失敗しました。ネットワーク接続を確認してください。';">
  </script>
  <script src="src/data/levels.js"></script>
  <script src="src/objects/Animal.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
