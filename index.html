<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Animal Escape!</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1a3a18;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
    }
    #error-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      max-width: 90%;
      text-align: center;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="error-msg">読み込み中...</div>

  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('error-msg');
      el.style.background = '#c0392b';
      el.textContent = 'エラー: ' + msg + '\n' + (src || '') + ':' + line;
    };
    function onPhaserError() {
      var el = document.getElementById('error-msg');
      el.style.background = '#c0392b';
      el.textContent = 'Phaserの読み込みに失敗しました。\nネットワーク接続を確認してください。';
    }
    function loadScript(src, onload, onerror) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = onload;
      s.onerror = onerror;
      document.body.appendChild(s);
    }
    // jsdelivrが失敗したらunpkgにフォールバック
    loadScript(
      'https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js',
      function() { loadGameScripts(); },
      function() {
        loadScript(
          'https://unpkg.com/phaser@3.60.0/dist/phaser.min.js',
          function() { loadGameScripts(); },
          onPhaserError
        );
      }
    );
    function loadGameScripts() {
      var scripts = [
        'src/data/levels.js',
        'src/objects/Animal.js',
        'src/scenes/MenuScene.js',
        'src/scenes/GameScene.js',
        'src/main.js'
      ];
      var i = 0;
      function next() {
        if (i >= scripts.length) return;
        loadScript(scripts[i++], next, function() {
          window.onerror('スクリプト読み込み失敗: ' + scripts[i-1]);
        });
      }
      next();
    }
  </script>
</body>
</html>
